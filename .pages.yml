# Configuration du back-office (Pages CMS)
media:
  input: src/media
  output: /media
content:
- name: actualites
  label: Actualités
  type: collection
  path: src/actualites
  filename: '{year}-{month}-{day}-{primary}.md'
  exclude:
  - actualites.11tydata.js
  view:
    fields:
    - title
    - date
    - brouillon
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Titre
    type: string
    required: true
  - name: date
    label: Date de publication
    type: date
    required: true
  - name: image
    label: Image principale
    type: image
  - name: image_alt
    label: Description de l'image (texte alternatif pour Google et les malvoyants)
    description: 'Décrire ce que montre l''image en quelques mots, par exemple : Mains réunies d''un groupe de parole.'
    type: string
  - name: resume
    label: Résumé (affiché sur les cartes)
    type: text
  - name: seo_titre
    label: Google — titre de la page (facultatif, 60 caractères environ)
    description: Titre affiché dans les résultats Google et l'onglet du navigateur. Laisser vide pour utiliser le titre de la page.
    type: string
    options:
      maxlength: 80
  - name: seo_description
    label: Google — description (recommandé, 1 à 2 phrases, 160 caractères environ)
    description: Résumé unique de la page, que Google peut afficher sous le titre. Ne pas copier la même description sur plusieurs pages.
    type: text
    options:
      maxlength: 170
  - name: brouillon
    label: Brouillon (cocher pour ne pas publier)
    type: boolean
    default: false
  - name: body
    label: Texte de l'article
    type: rich-text
    options:
      format: markdown
  - name: sections
    label: Blocs affichés après le texte (texte, bouton, image, bandeau)
    type: block
    list: true
    blockKey: type
    description: Les blocs s'affichent dans l'ordre. Un bandeau occupe toute la largeur de la page.
    blocks:
    - name: texte
      label: Texte
      fields:
      - name: texte
        label: Texte
        type: rich-text
        options:
          format: markdown
    - name: bouton
      label: Bouton
      fields:
      - name: texte
        label: Texte du bouton (ex. Me parler de votre projet)
        type: string
      - name: lien
        label: Lien (ex. /contact/ ou https://…)
        type: string
      - name: style
        label: Style
        type: select
        options:
          values:
          - Violet
          - Jaune
          - Contour
    - name: image
      label: Image
      fields:
      - name: image
        label: Image
        type: image
      - name: legende
        label: Légende (facultatif)
        type: string
    - name: bandeau
      label: Bandeau (pleine largeur, fond coloré)
      fields:
      - name: fond
        label: Couleur de fond
        type: select
        options:
          values:
          - Lavande
          - Bleu
          - Blanc
      - name: titre
        label: Titre (facultatif)
        type: string
      - name: texte
        label: Texte (facultatif)
        type: rich-text
        options:
          format: markdown
      - name: colonnes
        label: Colonnes (facultatif, 1 à 3 cases côte à côte)
        type: object
        list: true
        fields:
        - name: titre
          label: Titre de la case
          type: string
        - name: texte
          label: Texte de la case
          type: rich-text
          options:
            format: markdown
        - name: bouton_texte
          label: Texte du bouton (facultatif)
          type: string
        - name: bouton_lien
          label: Lien du bouton
          description: 'Une adresse (/contact/ ou https://…), ou un mot-clé : adhesion, don, rappeo, federation.'
          type: string
        - name: bouton_style
          label: Style du bouton
          type: select
          options:
            values:
            - Jaune
            - Contour
            - Violet
      - name: bouton_texte
        label: Bouton sous le bandeau — texte (facultatif)
        type: string
      - name: bouton_lien
        label: Bouton sous le bandeau — lien
        description: 'Une adresse (/contact/ ou https://…), ou un mot-clé : adhesion, don, rappeo, federation.'
        type: string
